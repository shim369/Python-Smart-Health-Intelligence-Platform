name: ML Weight Readiness Check

on:
  schedule:
    # 毎週月曜 06:00 JST (= 日曜 21:00 UTC)
    - cron: "0 21 * * 0"
  workflow_dispatch: {}

jobs:
  check-readiness:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - name: Check real-data accumulation and run Weight ML pipeline
        run: |
          {
            echo '### Weight ML Readiness'
            echo '```text'
            uv run python -m health_intelligence.ml.run_weight_pipeline
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
