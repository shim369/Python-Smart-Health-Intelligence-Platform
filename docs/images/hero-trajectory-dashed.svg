<svg viewBox="0 0 1200 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="点線のルートに沿ってお金・PC・グラフ・バーベル・走る人が並ぶイラスト" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- 背景 -->
  <circle cx="120" cy="60" r="260" fill="#e3f5ef" />
  <circle cx="1120" cy="430" r="190" fill="#ffffff" stroke="#dce8e4" stroke-width="2" />
  <circle cx="980" cy="90" r="60" fill="#e3f5ef" opacity="0.7" />

  <!-- 破線のルート -->
  <path d="M 80 430 C 260 400, 340 320, 520 280 C 700 240, 780 160, 960 110 C 1020 95, 1060 85, 1120 70"
        stroke="#10b981" stroke-width="5" fill="none" stroke-linecap="round" stroke-dasharray="2 14" opacity="0.55" />

  <!-- 中継点 -->
  <circle cx="300" cy="365" r="4" fill="#10b981" opacity="0.45" />
  <circle cx="740" cy="195" r="4" fill="#10b981" opacity="0.45" />
  <circle cx="990" cy="105" r="4" fill="#10b981" opacity="0.45" />

  <!-- バッジ1: お金 -->
  <g transform="translate(140, 410)">
    <circle r="54" fill="#ffffff" stroke="#dce8e4" stroke-width="3" />
    <ellipse cx="8" cy="6" rx="20" ry="8" fill="#10b981" />
    <ellipse cx="8" cy="-2" rx="20" ry="8" fill="#10b981" opacity="0.8" />
    <ellipse cx="8" cy="-10" rx="20" ry="8" fill="#10b981" opacity="0.6" />
    <circle cx="-18" cy="14" r="12" fill="none" stroke="#10b981" stroke-width="3" />
  </g>

  <!-- バッジ2: PC -->
  <g transform="translate(380, 330)">
    <circle r="54" fill="#ffffff" stroke="#dce8e4" stroke-width="3" />
    <rect x="-22" y="-18" width="44" height="28" rx="4" fill="#f5faf9" stroke="#10b981" stroke-width="4" />
    <path d="M -26 12 L 26 12 L 34 24 L -34 24 Z" fill="#10b981" />
    <path d="M -14 4 L -4 -6 L 6 0 L 18 -12" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- バッジ3: グラフ(最大、アクセントカラーはここだけ) -->
  <g transform="translate(620, 250)">
    <circle r="66" fill="#ffffff" stroke="#dce8e4" stroke-width="3" />
    <path d="M -30 26 L -30 -26 M -30 26 L 30 26" stroke="#dce8e4" stroke-width="3" stroke-linecap="round" />
    <rect x="-18" y="0" width="10" height="26" fill="#10b981" opacity="0.5" />
    <rect x="-2" y="-10" width="10" height="36" fill="#10b981" opacity="0.75" />
    <rect x="14" y="-20" width="10" height="46" fill="#10b981" />
    <path d="M -22 6 L -6 -6 L 10 -18 L 26 -30" fill="none" stroke="#0ea5e9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="26" cy="-30" r="4.5" fill="#0ea5e9" />
  </g>

  <!-- バッジ4: バーベル -->
  <g transform="translate(860, 150)">
    <circle r="54" fill="#ffffff" stroke="#dce8e4" stroke-width="3" />
    <rect x="-30" y="-4" width="60" height="8" rx="4" fill="#10b981" />
    <rect x="-38" y="-14" width="10" height="28" rx="4" fill="#10b981" />
    <rect x="28" y="-14" width="10" height="28" rx="4" fill="#10b981" />
  </g>

  <!-- バッジ5: 走る人(頂点) -->
  <g transform="translate(1080, 90)">
    <circle r="54" fill="#ffffff" stroke="#dce8e4" stroke-width="3" />
    <circle cx="4" cy="-22" r="8" fill="#10b981" />
    <path d="M 4 -14 L -4 4" stroke="#10b981" stroke-width="5.5" stroke-linecap="round" />
    <path d="M -4 4 L -20 16" stroke="#10b981" stroke-width="5.5" stroke-linecap="round" />
    <path d="M -4 4 L 6 24" stroke="#10b981" stroke-width="5.5" stroke-linecap="round" />
    <path d="M 1 -9 L 20 -18" stroke="#10b981" stroke-width="5.5" stroke-linecap="round" />
    <path d="M 1 -3 L -15 -10" stroke="#10b981" stroke-width="5.5" stroke-linecap="round" />
  </g>
</svg>
